apiVersion: v1
kind: Secret
metadata:
  name: mcp-registry-secrets
  namespace: mcp-registry
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql+asyncpg://mcp_user:your_secure_password@mcp-postgres:5432/mcp_registry"
  
  # Redis
  REDIS_URL: "redis://:your_redis_password@mcp-redis:6379/0"
  
  # Encryption (generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
  CREDENTIAL_ENCRYPTION_KEY: "your-32-byte-base64-key-generated-here="
  
  # Bootstrap secret (change immediately after first admin creation)
  ADMIN_CREATION_SECRET: "bootstrap-secret-change-me-now"
  
  # Langfuse (optional)
  LANGFUSE_PUBLIC_KEY: "pk-lf-xxxx"
  LANGFUSE_SECRET_KEY: "sk-lf-yyyy"
